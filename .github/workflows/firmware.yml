name: Firmware build

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        shell: bash
        run: bash -n tools/build.sh tools/install-esp-idf.sh

  esp32s3:
    # 暂停 PR/分支上的完整编译；定位 Linux 构建失败后恢复自动执行。
    if: github.event_name == 'workflow_dispatch'
    needs: scripts
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Build car firmware
        shell: bash
        run: ./tools/build.sh
